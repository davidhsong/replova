<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Replova — Reputation Management for Restaurants</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* ─────────── REPLOVA DESIGN SYSTEM ───────────
   Visual register: Mercury × Stripe × Linear × Things 3
   - Warm neutrals (not cold gray) — paper-feel base
   - One accent (terracotta) used sparingly
   - Inter for UI, Instrument Serif for editorial moments
   - 13–14px body, tabular numerals, 1px hairlines
   - Sharp corners on data tables, soft on inputs/CTAs
*/

:root {
  /* Surfaces — warm neutrals, off-white paper */
  --bg:           #faf9f6;
  --surface:      #ffffff;
  --surface-2:    #f4f2ec;
  --surface-3:    #ebe8df;

  /* Hairlines */
  --line:         rgba(20, 18, 12, 0.08);
  --line-md:      rgba(20, 18, 12, 0.14);
  --line-hi:      rgba(20, 18, 12, 0.22);

  /* Text — warm graphite */
  --t1:           #14120c;
  --t2:           #4d4a40;
  --t3:           #807c70;
  --t4:           #b6b1a3;

  /* Accent — terracotta */
  --accent:       #b94a2c;
  --accent-hi:    #a23d22;
  --accent-sub:   rgba(185, 74, 44, 0.10);
  --accent-line:  rgba(185, 74, 44, 0.28);

  /* Sentiment — muted, not crayon */
  --neg:          #b73a2a;
  --neg-sub:      rgba(183, 58, 42, 0.09);
  --neg-line:     rgba(183, 58, 42, 0.22);
  --warn:         #b07b1a;
  --warn-sub:     rgba(176, 123, 26, 0.10);
  --warn-line:    rgba(176, 123, 26, 0.24);
  --pos:          #1f6f4a;
  --pos-sub:      rgba(31, 111, 74, 0.09);
  --pos-line:     rgba(31, 111, 74, 0.22);
  --gold:         #c08725;

  /* Shadows — almost none. Hairlines instead. */
  --shadow-1:     0 1px 0 rgba(20,18,12,0.04);
  --shadow-2:     0 4px 16px rgba(20,18,12,0.06), 0 1px 2px rgba(20,18,12,0.04);
  --shadow-3:     0 24px 64px rgba(20,18,12,0.10), 0 2px 4px rgba(20,18,12,0.04);

  /* Radii — sharp on data, soft on inputs/CTAs */
  --r-0:  0;
  --r-1:  2px;
  --r-2:  4px;
  --r-3:  6px;
  --r-4:  8px;
  --r-5:  10px;
  --r-6:  12px;
  --r-7:  16px;
  --r-pill: 999px;

  /* Type scale */
  --ui:    'Inter', system-ui, -apple-system, sans-serif;
  --serif: 'Instrument Serif', 'Tiempos', Georgia, serif;
  --mono:  'JetBrains Mono', 'SF Mono', Menlo, monospace;
}

[data-theme="dark"] {
  --bg:        #0e0d0a;
  --surface:   #15140f;
  --surface-2: #1d1b15;
  --surface-3: #28251c;
  --line:      rgba(255, 250, 235, 0.07);
  --line-md:   rgba(255, 250, 235, 0.12);
  --line-hi:   rgba(255, 250, 235, 0.20);
  --t1:        #f5f1e6;
  --t2:        #aea89a;
  --t3:        #807a6c;
  --t4:        #4d493f;
  --accent:    #d65f3e;
  --accent-hi: #e87655;
  --accent-sub: rgba(214, 95, 62, 0.14);
  --accent-line: rgba(214, 95, 62, 0.32);
  --neg:       #e57363;
  --neg-sub:   rgba(229, 115, 99, 0.10);
  --neg-line:  rgba(229, 115, 99, 0.24);
  --warn:      #d4a23e;
  --warn-sub:  rgba(212, 162, 62, 0.10);
  --warn-line: rgba(212, 162, 62, 0.24);
  --pos:       #6cba8b;
  --pos-sub:   rgba(108, 186, 139, 0.10);
  --pos-line:  rgba(108, 186, 139, 0.24);
  --gold:      #e0a445;
  --shadow-2:  0 4px 16px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
}

/* Reset + base */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: var(--ui);
  background: var(--bg);
  color: var(--t1);
  font-size: 14px;
  line-height: 1.5;
  font-feature-settings: "ss01", "cv11";
  min-height: 100dvh;
}
[data-density="compact"] body { font-size: 13px; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
input, textarea { background: transparent; border: none; outline: none; }
button { background: none; border: none; cursor: pointer; padding: 0; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-md); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--line-hi); }

/* Numbers want tabular */
.tnum, .num, [data-num] { font-variant-numeric: tabular-nums; }

/* Type ramp */
.t-display { font-family: var(--serif); font-size: 56px; line-height: 1; letter-spacing: -0.025em; font-weight: 400; }
.t-h1      { font-size: 28px; line-height: 1.15; letter-spacing: -0.025em; font-weight: 700; }
.t-h2      { font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 700; }
.t-h3      { font-size: 15px; line-height: 1.35; letter-spacing: -0.01em; font-weight: 600; }
.t-body    { font-size: 14px; line-height: 1.55; }
.t-sm      { font-size: 13px; line-height: 1.55; }
.t-xs      { font-size: 12px; line-height: 1.5; }
.t-eyebrow { font-size: 11px; line-height: 1.3; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--t3); }
.t-mono    { font-family: var(--mono); font-feature-settings: "tnum" on; }
.t-serif   { font-family: var(--serif); }
.t-italic  { font-style: italic; }

/* Color helpers */
.c-t1 { color: var(--t1); }
.c-t2 { color: var(--t2); }
.c-t3 { color: var(--t3); }
.c-t4 { color: var(--t4); }
.c-accent { color: var(--accent); }
.c-neg { color: var(--neg); }
.c-pos { color: var(--pos); }
.c-warn { color: var(--warn); }
.c-gold { color: var(--gold); }

/* Atoms ── hairline divider */
.hr { height: 1px; background: var(--line); border: 0; }
.vr { width: 1px; background: var(--line); align-self: stretch; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; height: 36px; padding: 0 16px;
  border-radius: var(--r-pill);
  font-size: 13px; font-weight: 500;
  white-space: nowrap;
  transition: background 0.12s, color 0.12s, border-color 0.12s, transform 0.08s;
}
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--t1); color: var(--bg); font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: #000; }
[data-theme="dark"] .btn-primary:hover:not(:disabled) { background: var(--t1); filter: brightness(1.1); }
.btn-accent { background: var(--accent); color: #fff; font-weight: 600; }
.btn-accent:hover:not(:disabled) { background: var(--accent-hi); }
.btn-ghost { background: transparent; border: 1px solid var(--line-md); color: var(--t1); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line-hi); }
.btn-quiet { background: transparent; color: var(--t2); }
.btn-quiet:hover:not(:disabled) { background: var(--surface-2); color: var(--t1); }
.btn-danger { background: transparent; color: var(--neg); border: 1px solid var(--neg-line); }
.btn-danger:hover:not(:disabled) { background: var(--neg-sub); }
.btn-sm { height: 28px; padding: 0 12px; font-size: 12px; }
.btn-lg { height: 44px; padding: 0 20px; font-size: 14px; }

/* Inputs */
.field {
  width: 100%; height: 40px; padding: 0 12px;
  background: var(--surface);
  border: 1px solid var(--line-md);
  border-radius: var(--r-5);
  transition: border-color 0.12s, box-shadow 0.12s;
}
.field::placeholder { color: var(--t4); }
.field:focus { border-color: var(--t1); box-shadow: 0 0 0 3px rgba(20,18,12,0.06); }
[data-theme="dark"] .field:focus { box-shadow: 0 0 0 3px rgba(245,241,230,0.08); }
.field-lg { height: 48px; padding: 0 14px; font-size: 15px; }
textarea.field { padding: 10px 12px; height: auto; min-height: 80px; resize: vertical; line-height: 1.5; }

/* Cards & surfaces — minimal shadow, hairline first */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-7); }
.card-inset { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-6); }
.card-flat { border: 1px solid var(--line); border-radius: var(--r-7); }

/* Pills/badges */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 8px;
  border-radius: var(--r-3);
  font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
  background: var(--surface-2); color: var(--t2);
  border: 1px solid var(--line);
}
.pill-neg { background: var(--neg-sub); color: var(--neg); border-color: var(--neg-line); }
.pill-pos { background: var(--pos-sub); color: var(--pos); border-color: var(--pos-line); }
.pill-warn { background: var(--warn-sub); color: var(--warn); border-color: var(--warn-line); }
.pill-accent { background: var(--accent-sub); color: var(--accent); border-color: var(--accent-line); }

.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.dot-pos { background: var(--pos); }
.dot-neg { background: var(--neg); }
.dot-warn { background: var(--warn); }
.dot-pulse { animation: pulse 2s ease infinite; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes shimmer { 0% { opacity: 0.6; } 100% { opacity: 1; } }
.fade-in { animation: fadeIn 0.18s ease both; }
.fade-up { animation: fadeUp 0.28s cubic-bezier(.2,.7,.2,1) both; }
.spin { animation: spin 0.7s linear infinite; }

/* Stars */
.stars { display: inline-flex; gap: 1px; color: var(--gold); font-size: 13px; letter-spacing: 0; }
.stars .empty { color: var(--line-md); }

/* Sidebar app shell */
.app { display: flex; min-height: 100dvh; background: var(--bg); }
.sidebar {
  width: 232px; flex-shrink: 0;
  height: 100dvh; position: sticky; top: 0;
  border-right: 1px solid var(--line);
  background: var(--surface);
  display: flex; flex-direction: column;
}
.main { flex: 1; min-width: 0; }
.nav-group { padding: 4px 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; height: 32px; padding: 0 10px;
  border-radius: var(--r-4);
  font-size: 13px; font-weight: 500;
  color: var(--t2);
  transition: background 0.1s, color 0.1s;
}
.nav-item:hover { background: var(--surface-2); color: var(--t1); }
.nav-item.active { background: var(--surface-2); color: var(--t1); }
.nav-item .ico { width: 14px; height: 14px; opacity: 0.7; flex-shrink: 0; }
.nav-item.active .ico { opacity: 1; color: var(--accent); }
.nav-counter {
  margin-left: auto;
  font-size: 11px; font-weight: 600; color: var(--t3);
  font-variant-numeric: tabular-nums;
}
.nav-item.active .nav-counter { color: var(--t1); }

/* Page header */
.page-header { padding: 28px 32px 0; }
.page-body { padding: 24px 32px 56px; }
.page-narrow { max-width: 880px; }

/* Hairline tabs */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
.tab {
  height: 36px; padding: 0 14px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500; color: var(--t3);
  margin-bottom: -1px;
  border-bottom: 1px solid transparent;
  transition: color 0.1s, border-color 0.1s;
}
.tab:hover { color: var(--t1); }
.tab.active { color: var(--t1); border-bottom-color: var(--t1); }

/* Data table */
.dtable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.dtable th, .dtable td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.dtable thead th {
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--t3);
  background: var(--surface-2);
  border-bottom: 1px solid var(--line-md);
  border-top: 1px solid var(--line);
}
.dtable tbody tr { transition: background 0.08s; }
.dtable tbody tr:hover { background: var(--surface-2); }

/* Phone frames */
.phone {
  width: 320px; height: 660px;
  background: var(--bg);
  border: 8px solid #1a1812;
  border-radius: 36px;
  box-shadow: var(--shadow-3);
  position: relative; overflow: hidden;
}
.phone-screen { width: 100%; height: 100%; overflow: auto; background: var(--bg); }
.phone-notch {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 92px; height: 24px; background: #1a1812;
  border-radius: 0 0 14px 14px; z-index: 10;
}

/* Email frame */
.email-frame {
  width: 600px; background: #fff; border: 1px solid var(--line-md);
  border-radius: var(--r-6); overflow: hidden; box-shadow: var(--shadow-2);
}

/* Sentiment heatmap dot */
.sent-cell {
  width: 24px; height: 24px; border-radius: var(--r-2);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600;
}

/* Tweaks panel */
.tweaks-panel {
  position: fixed; bottom: 24px; right: 24px; z-index: 200;
  width: 280px;
  background: var(--surface);
  border: 1px solid var(--line-md);
  border-radius: var(--r-6);
  box-shadow: var(--shadow-3);
  padding: 18px;
}
.tweaks-panel.hidden { display: none; }
.tweak-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.tweak-label { font-size: 11px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; transition: transform 0.1s; border: 2px solid transparent; }
.swatch:hover { transform: scale(1.08); }
.swatch.on { border-color: var(--t1); }
.seg {
  display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-4); padding: 2px;
}
.seg button {
  height: 24px; padding: 0 10px; border-radius: var(--r-3);
  font-size: 11px; font-weight: 600; color: var(--t3); transition: all 0.1s;
}
.seg button.on { background: var(--surface); color: var(--t1); box-shadow: var(--shadow-1); }

/* Score gauge */
.gauge-bg { stroke: var(--line); }
.gauge-fg { stroke: var(--accent); transition: stroke-dashoffset 0.4s; }

/* Annotation block */
.note {
  font-family: var(--mono); font-size: 11px; color: var(--t3);
  background: var(--surface-2);
  border-left: 2px solid var(--line-md);
  padding: 10px 14px; border-radius: var(--r-3);
  line-height: 1.55;
  white-space: pre-wrap;
}

/* Skeleton */
.skel { background: var(--surface-2); border-radius: 4px; animation: shimmer 1.4s ease-in-out infinite alternate; }

@media (max-width: 720px) {
  .sidebar { display: none; }
  .page-header, .page-body { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body data-theme="light" data-density="comfortable">
  <div id="root"></div>

  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/shell.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/landing.jsx"></script>
  <script type="text/babel" src="src/auth.jsx"></script>
  <script type="text/babel" src="src/dash-parts.jsx"></script>
  <script type="text/babel" src="src/dashboard.jsx"></script>
  <script type="text/babel" src="src/settings.jsx"></script>
  <script type="text/babel" src="src/billing.jsx"></script>
  <script type="text/babel" src="src/competitors.jsx"></script>
  <script type="text/babel" src="src/requests.jsx"></script>
  <script type="text/babel" src="src/legal.jsx"></script>
  <script type="text/babel" src="src/emails.jsx"></script>
  <script type="text/babel" src="src/mobile.jsx"></script>
  <script type="text/babel" src="src/canvas.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "light",
      "accent": "terracotta",
      "density": "comfortable",
      "negativeStyle": "editorial",
      "scoreStyle": "arc",
      "emptyStyle": "editorial"
    }/*EDITMODE-END*/;

    const ACCENT_MAP = {
      terracotta: { light: ['#b94a2c','#a23d22'], dark: ['#d65f3e','#e87655'] },
      ink:        { light: ['#1a1a1a','#000000'], dark: ['#f5f1e6','#ffffff'] },
      forest:     { light: ['#1f6f4a','#155939'], dark: ['#6cba8b','#7fcc9c'] },
      indigo:     { light: ['#3b5cf0','#2c47d8'], dark: ['#7e96ff','#94a8ff'] },
      plum:       { light: ['#7a4cc4','#683ab0'], dark: ['#b491e8','#c5a5f0'] },
    };

    function applyTweaks(tw) {
      const root = document.documentElement;
      document.body.dataset.theme = tw.theme;
      document.body.dataset.density = tw.density;
      const m = ACCENT_MAP[tw.accent] || ACCENT_MAP.terracotta;
      const [a, ah] = m[tw.theme] || m.light;
      root.style.setProperty('--accent', a);
      root.style.setProperty('--accent-hi', ah);
      // accent-sub/line follow accent
      function rgb(hex) {
        const h = hex.replace('#','');
        return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)).join(',');
      }
      root.style.setProperty('--accent-sub', `rgba(${rgb(a)}, 0.10)`);
      root.style.setProperty('--accent-line', `rgba(${rgb(a)}, 0.28)`);
    }

    function App() {
      const [route, setRoute] = useState(() => {
        const h = window.location.hash.replace('#','');
        return h || '/canvas';
      });
      const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
      const [tweaksVisible, setTweaksVisible] = useState(false);

      window.__nav = (p) => {
        setRoute(p);
        window.location.hash = p;
        window.scrollTo(0,0);
      };
      window.__tweaks = tweaks;

      useEffect(() => { applyTweaks(tweaks); }, [tweaks]);

      useEffect(() => {
        function onHash() {
          const h = window.location.hash.replace('#','') || '/';
          setRoute(h);
        }
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      useEffect(() => {
        const handler = (e) => {
          if (e.data?.type === '__activate_edit_mode')   setTweaksVisible(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
          if (e.data?.type === '__edit_mode_set_keys') {
            setTweaks(prev => ({...prev, ...e.data.edits}));
          }
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({type:'__edit_mode_available'}, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      function setTweak(k, v) {
        const next = {...tweaks, [k]: v};
        setTweaks(next);
        window.parent.postMessage({type:'__edit_mode_set_keys', edits: {[k]: v}}, '*');
      }

      const Page = (() => {
        const r = route;
        if (r === '/' || r === '') return window.LandingPage;
        if (r === '/signin')        return window.SignInPage;
        if (r === '/onboard')       return window.OnboardPage;
        if (r === '/privacy' || r === '/terms' || r === '/refunds') return window.LegalPage;
        if (r === '/dashboard')     return window.DashboardPage;
        if (r === '/dashboard/settings') return window.SettingsPage;
        if (r === '/dashboard/billing')  return window.BillingPage;
        if (r === '/dashboard/competitors') return window.CompetitorsPage;
        if (r === '/dashboard/review-requests') return window.RequestsPage;
        if (r === '/dashboard/empty') return window.EmptyStatePage;
        if (r === '/emails') return window.EmailsPage;
        if (r === '/mobile') return window.MobilePage;
        if (r === '/canvas') return window.CanvasOverviewPage;
        return window.LandingPage;
      })();

      return (
        <>
          {Page ? <Page route={route} tweaks={tweaks} /> : <div style={{padding:32}}>Loading…</div>}
          <div className={`tweaks-panel ${tweaksVisible ? '' : 'hidden'}`}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--t1)'}}>Tweaks</div>
              <button onClick={() => { setTweaksVisible(false); window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); }}
                style={{color:'var(--t3)',fontSize:11,padding:'2px 4px'}}>Close</button>
            </div>

            <div style={{marginBottom:14}}>
              <div className="tweak-label">Theme</div>
              <div className="seg">
                {['light','dark'].map(t => (
                  <button key={t} className={tweaks.theme===t?'on':''} onClick={()=>setTweak('theme',t)}>{t}</button>
                ))}
              </div>
            </div>

            <div style={{marginBottom:14}}>
              <div className="tweak-label">Accent</div>
              <div style={{display:'flex',gap:8}}>
                {[
                  ['terracotta', '#b94a2c'],
                  ['ink', '#1a1a1a'],
                  ['forest', '#1f6f4a'],
                  ['indigo', '#3b5cf0'],
                  ['plum', '#7a4cc4'],
                ].map(([k,c]) => (
                  <button key={k} className={`swatch ${tweaks.accent===k?'on':''}`}
                    style={{background:c}} onClick={()=>setTweak('accent',k)} title={k}/>
                ))}
              </div>
            </div>

            <div style={{marginBottom:14}}>
              <div className="tweak-label">Density</div>
              <div className="seg">
                {['compact','comfortable'].map(d => (
                  <button key={d} className={tweaks.density===d?'on':''} onClick={()=>setTweak('density',d)}>{d}</button>
                ))}
              </div>
            </div>

            <div style={{marginBottom:14}}>
              <div className="tweak-label">Negative review</div>
              <div className="seg">
                {['editorial','urgent','quiet'].map(d => (
                  <button key={d} className={tweaks.negativeStyle===d?'on':''} onClick={()=>setTweak('negativeStyle',d)}>{d}</button>
                ))}
              </div>
            </div>

            <div style={{marginBottom:14}}>
              <div className="tweak-label">Score style</div>
              <div className="seg">
                {['arc','numeric','bar'].map(d => (
                  <button key={d} className={tweaks.scoreStyle===d?'on':''} onClick={()=>setTweak('scoreStyle',d)}>{d}</button>
                ))}
              </div>
            </div>

            <div>
              <div className="tweak-label">Empty state</div>
              <div className="seg">
                {['editorial','minimal','tutorial'].map(d => (
                  <button key={d} className={tweaks.emptyStyle===d?'on':''} onClick={()=>setTweak('emptyStyle',d)}>{d}</button>
                ))}
              </div>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
