<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Replova — AI Review Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    /* ── DESIGN TOKENS ──────────────────────────────────────── */
    :root {
      --bg:           #09090b;
      --surface-0:    #0c0c0f;
      --surface-1:    #111115;
      --surface-2:    #1a1a21;
      --border:       rgba(255,255,255,0.07);
      --border-md:    rgba(255,255,255,0.11);
      --border-hi:    rgba(255,255,255,0.16);
      --t1:  #f2f1f0;
      --t2:  #8b8a93;
      --t3:  #4a4a56;
      --accent:       oklch(0.61 0.2 258);
      --accent-hi:    oklch(0.68 0.18 258);
      --accent-sub:   oklch(0.61 0.2 258 / 0.12);
      --ok:           #22c55e;
      --ok-sub:       rgba(34,197,94,0.1);
      --warn:         #f59e0b;
      --warn-sub:     rgba(245,158,11,0.1);
      --err:          #ef4444;
      --err-sub:      rgba(239,68,68,0.1);
      --sidebar-w:    224px;
      --radius-s: 8px;
      --radius-m: 12px;
      --radius-l: 16px;
      --radius-xl: 20px;
    }
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--t1);
      min-height: 100dvh; font-size: 14px; line-height: 1.5;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 999px; }
    a { text-decoration: none; color: inherit; }
    button, input, textarea { font-family: inherit; }
    
    /* Animations */
    @keyframes fadeUp   { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
    @keyframes fadeIn   { from { opacity:0 } to { opacity:1 } }
    @keyframes spin     { to { transform:rotate(360deg) } }
    @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes shimmer  { to { background-position:-200% 0 } }
    .fade-up  { animation: fadeUp  .35s ease both }
    .fade-in  { animation: fadeIn  .2s ease both }
    .spin     { animation: spin    .75s linear infinite }
    .pulse-d  { animation: pulse   2s ease infinite }

    /* ── BUTTONS ──────────────────────────────────────────── */
    .btn {
      display:inline-flex; align-items:center; justify-content:center;
      gap:6px; padding:8px 16px; border-radius:999px; border:none;
      cursor:pointer; font-size:13px; font-weight:500;
      transition:all .15s; white-space:nowrap; font-family:inherit;
      text-decoration:none;
    }
    .btn:active:not(:disabled) { transform:scale(.97) }
    .btn:disabled { opacity:.4; cursor:not-allowed }
    .btn-primary  { background:var(--accent); color:#fff }
    .btn-primary:hover:not(:disabled) { background:var(--accent-hi) }
    .btn-dark     { background:var(--t1); color:var(--bg); font-weight:600 }
    .btn-dark:hover:not(:disabled) { background:#fff }
    .btn-ghost    { background:transparent; color:var(--t2); border:1px solid var(--border-md) }
    .btn-ghost:hover:not(:disabled) { background:var(--surface-2); color:var(--t1) }
    .btn-danger   { background:var(--err-sub); color:var(--err); border:1px solid rgba(239,68,68,.2) }
    .btn-danger:hover:not(:disabled) { background:rgba(239,68,68,.18) }
    .btn-sm       { padding:5px 12px; font-size:12px; border-radius:var(--radius-m) }
    .btn-md       { padding:9px 18px }
    .btn-lg       { padding:12px 24px; font-size:14px; font-weight:600 }

    /* ── INPUTS ───────────────────────────────────────────── */
    .input {
      width:100%; background:var(--surface-1); border:1px solid var(--border-md);
      border-radius:var(--radius-m); padding:10px 14px; font-size:14px;
      color:var(--t1); transition:border-color .15s, box-shadow .15s; outline:none;
    }
    .input::placeholder { color:var(--t3) }
    .input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-sub) }
    .label {
      font-size:11px; font-weight:600; text-transform:uppercase;
      letter-spacing:.07em; color:var(--t3);
    }

    /* ── BADGES ───────────────────────────────────────────── */
    .badge {
      display:inline-flex; align-items:center; padding:2px 7px;
      border-radius:6px; font-size:11px; font-weight:600;
    }
    .badge-red    { background:var(--err-sub);  color:var(--err);  border:1px solid rgba(239,68,68,.2) }
    .badge-amber  { background:var(--warn-sub); color:var(--warn); border:1px solid rgba(245,158,11,.2) }
    .badge-green  { background:var(--ok-sub);   color:var(--ok);   border:1px solid rgba(34,197,94,.2) }
    .badge-blue   { background:var(--accent-sub);color:var(--accent);border:1px solid oklch(0.61 0.2 258/.25) }
    .badge-zinc   { background:rgba(255,255,255,.05);color:var(--t2);border:1px solid var(--border) }

    /* ── LAYOUT ───────────────────────────────────────────── */
    .app-shell { display:flex; min-height:100dvh }
    .sidebar {
      width:var(--sidebar-w); min-height:100dvh; flex-shrink:0;
      background:var(--surface-0); border-right:1px solid var(--border);
      display:flex; flex-direction:column; position:sticky; top:0; height:100dvh;
    }
    .sidebar-body { flex:1; overflow-y:auto; padding:8px 10px }
    .sidebar-foot { padding:10px; border-top:1px solid var(--border) }
    .main { flex:1; overflow-y:auto; min-width:0 }

    .nav-item {
      display:flex; align-items:center; gap:9px; padding:7px 10px;
      border-radius:var(--radius-s); color:var(--t2); font-size:13px; font-weight:500;
      cursor:pointer; transition:all .12s; border:none; background:none;
      font-family:inherit; width:100%; text-align:left;
    }
    .nav-item:hover { background:var(--surface-2); color:var(--t1) }
    .nav-item.active { background:var(--surface-2); color:var(--t1) }
    .nav-item svg { flex-shrink:0; opacity:.65 }
    .nav-item.active svg { opacity:1 }

    /* ── REVIEW ROWS ──────────────────────────────────────── */
    .review-row {
      border:1px solid var(--border); border-radius:var(--radius-m);
      margin-bottom:4px; transition:border-color .12s, background .12s;
    }
    .review-row:hover { border-color:var(--border-md) }
    .review-row.open  { border-color:var(--border-md); background:var(--surface-1) }
    .review-row.replied { opacity:.42 }

    .draft-tab {
      padding:5px 12px; font-size:12px; font-weight:500; border-radius:var(--radius-s);
      cursor:pointer; color:var(--t2); transition:all .12s;
      border:1px solid transparent; background:none; font-family:inherit;
    }
    .draft-tab:hover { color:var(--t1) }
    .draft-tab.active { background:var(--surface-2); color:var(--t1); border-color:var(--border-md) }

    .check-btn {
      width:24px; height:24px; border-radius:50%;
      border:1px solid var(--border-md); background:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .15s; flex-shrink:0;
    }
    .check-btn:hover { border-color:var(--ok); background:var(--ok-sub) }
    .check-btn.done  { border-color:var(--ok); background:var(--ok-sub) }
    .check-btn svg   { color:var(--t3); transition:color .12s }
    .check-btn.done svg { color:var(--ok) }

    /* ── CARDS & MISC ──────────────────────────────────────── */
    .card { background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-l) }
    .stat-card { padding:16px 20px; border-radius:var(--radius-m); border:1px solid var(--border); background:var(--surface-1) }
    .banner { display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:var(--radius-m); font-size:13px; font-weight:500 }
    .banner-green { background:var(--ok-sub);   color:var(--ok);   border:1px solid rgba(34,197,94,.2) }
    .banner-amber { background:var(--warn-sub); color:var(--warn); border:1px solid rgba(245,158,11,.2) }
    .banner-red   { background:var(--err-sub);  color:var(--err);  border:1px solid rgba(239,68,68,.2) }
    .dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0 }
    .dot-green { background:var(--ok) }
    .dot-amber { background:var(--warn) }
    .dot-red   { background:var(--err) }
    .tab-bar { display:flex; border-bottom:1px solid var(--border) }
    .tab-btn {
      padding:10px 16px; font-size:13px; font-weight:500; color:var(--t2);
      cursor:pointer; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;
      background:none; transition:color .12s; display:flex; align-items:center; gap:6px; font-family:inherit;
    }
    .tab-btn:hover { color:var(--t1) }
    .tab-btn.active { color:var(--t1); border-bottom-color:var(--t1) }
    .divider { height:1px; background:var(--border) }
    .page-wrap { max-width:840px; margin:0 auto; padding:28px 28px }
    .sec-head { padding:24px 28px 20px; border-bottom:1px solid var(--border) }

    .search-wrap { position:relative }
    .search-wrap svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); pointer-events:none }
    .search-wrap .input { padding-left:34px }

    /* ── TWEAKS PANEL ─────────────────────────────────────── */
    .tweaks-panel {
      position:fixed; bottom:24px; right:24px; z-index:1000;
      background:var(--surface-1); border:1px solid var(--border-md);
      border-radius:var(--radius-l); padding:20px; width:240px;
      box-shadow:0 8px 40px rgba(0,0,0,.5);
      display:none;
    }
    .tweaks-panel.visible { display:block }

    @media(max-width:768px){
      :root { --sidebar-w:56px }
      .sidebar .nav-lbl,.sidebar .logo-txt,.sidebar .usr-name { display:none }
      .page-wrap { padding:20px 16px }
      .sec-head { padding:18px 16px }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components/Landing.jsx"></script>
  <script type="text/babel" src="components/Auth.jsx"></script>
  <script type="text/babel" src="components/Dashboard.jsx"></script>
  <script type="text/babel" src="components/Settings.jsx"></script>
  <script type="text/babel" src="components/Billing.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#4a7cf6",
      "density": "comfortable",
      "showWelcomeBanner": true
    }/*EDITMODE-END*/;

    function App() {
      const [page, setPage] = useState(() => localStorage.getItem('rpl_page') || '/');
      const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
      const [tweaksVisible, setTweaksVisible] = useState(false);

      window.__nav = (p) => { setPage(p); localStorage.setItem('rpl_page', p); window.scrollTo(0,0); };

      useEffect(() => {
        // Apply accent color
        document.documentElement.style.setProperty('--accent',
          tweaks.accent === 'indigo' ? 'oklch(0.58 0.22 278)' :
          tweaks.accent === 'violet' ? 'oklch(0.6 0.22 300)' :
          tweaks.accent);
        document.documentElement.style.setProperty('--accent-hi',
          tweaks.accent === 'indigo' ? 'oklch(0.66 0.2 278)' :
          tweaks.accent === 'violet' ? 'oklch(0.68 0.2 300)' :
          'oklch(0.68 0.18 258)');
      }, [tweaks]);

      useEffect(() => {
        const handler = (e) => {
          if (e.data?.type === '__activate_edit_mode')   setTweaksVisible(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
          if (e.data?.type === '__edit_mode_set_keys') {
            setTweaks(prev => ({...prev, ...e.data.edits}));
          }
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({type:'__edit_mode_available'}, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      function setTweak(k, v) {
        const next = {...tweaks, [k]: v};
        setTweaks(next);
        window.parent.postMessage({type:'__edit_mode_set_keys', edits: next}, '*');
      }

      const renderPage = () => {
        if (page === '/')                    return <LandingPage />;
        if (page === '/signin')              return <SignInPage />;
        if (page === '/onboard')             return <OnboardPage />;
        if (page === '/dashboard')           return <DashboardPage tweaks={tweaks} />;
        if (page === '/dashboard/settings')  return <SettingsPage />;
        if (page === '/dashboard/billing')   return <BillingPage />;
        return <LandingPage />;
      };

      return (
        <>
          {renderPage()}
          {/* Tweaks Panel */}
          <div className={`tweaks-panel ${tweaksVisible ? 'visible' : ''}`}>
            <div style={{fontWeight:700, fontSize:13, color:'var(--t1)', marginBottom:16}}>Tweaks</div>
            <div style={{marginBottom:14}}>
              <div className="label" style={{marginBottom:8}}>Accent color</div>
              <div style={{display:'flex',gap:6}}>
                {[
                  {v:'#4a7cf6',bg:'#4a7cf6'},
                  {v:'indigo',bg:'oklch(0.58 0.22 278)'},
                  {v:'violet',bg:'oklch(0.6 0.22 300)'},
                ].map(c => (
                  <button key={c.v} onClick={() => setTweak('accent', c.v)} style={{
                    width:28,height:28,borderRadius:'50%',background:c.bg,border:'none',cursor:'pointer',
                    outline:tweaks.accent===c.v ? '2px solid var(--t1)' : '2px solid transparent',
                    outlineOffset:2, transition:'outline .12s',
                  }}/>
                ))}
              </div>
            </div>
            <div style={{marginBottom:14}}>
              <div className="label" style={{marginBottom:8}}>Density</div>
              <div style={{display:'flex',gap:4}}>
                {['compact','comfortable'].map(d => (
                  <button key={d} onClick={() => setTweak('density', d)} style={{
                    flex:1,padding:'5px 8px',borderRadius:8,border:'1px solid var(--border-md)',cursor:'pointer',
                    background:tweaks.density===d ? 'var(--surface-2)' : 'transparent',
                    color:tweaks.density===d ? 'var(--t1)' : 'var(--t2)',
                    fontSize:11,fontWeight:600,fontFamily:'inherit',transition:'all .12s',
                  }}>{d}</button>
                ))}
              </div>
            </div>
            <div>
              <div className="label" style={{marginBottom:8}}>Welcome banner</div>
              <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
                <input type="checkbox" checked={tweaks.showWelcomeBanner} onChange={e => setTweak('showWelcomeBanner', e.target.checked)} style={{accentColor:'var(--accent)',width:14,height:14}}/>
                <span style={{fontSize:12,color:'var(--t2)'}}>Show success banner</span>
              </label>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
